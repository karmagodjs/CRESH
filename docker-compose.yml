version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: cri-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cri-api
    ports:
      - "8000:8000"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_LOCATION=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=research_papers
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cri-frontend
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_LOCATION=http://qdrant:6333
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
