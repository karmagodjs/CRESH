[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cohere-research-intelligence"
version = "1.0.0"
description = "Production-grade research intelligence system powered by Cohere and LangGraph"
authors = [{ name = "AI Research Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cohere>=7.1.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.0.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
